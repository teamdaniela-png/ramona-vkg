services:
  postgres:
    image: postgres:16
    container_name: ramona_postgres
    environment:
      POSTGRES_USER: ramona
      POSTGRES_PASSWORD: ramona_demo
      POSTGRES_DB: ramona
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramona -d ramona"]
      interval: 5s
      timeout: 5s
      retries: 20

  ontop:
    # ontop/ontop is the image Ontop publishes; ontop/ontop-endpoint has no 5.x tags.
    image: ontop/ontop:5.5.0
    container_name: ramona_ontop
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/ratr-o.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/ramona.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_DEV_MODE: "true"
    volumes:
      - ./ontology/ratr-o.ttl:/opt/ontop/input/ratr-o.ttl:ro
      - ./mappings/ramona.obda:/opt/ontop/input/ramona.obda:ro
      - ./ontop/ontop.properties:/opt/ontop/input/ontop.properties:ro
      # The image ships no JDBC driver. Put the PostgreSQL driver jar in ./jdbc (see README).
      - ./jdbc:/opt/ontop/jdbc:ro
    ports:
      - "8080:8080"

volumes:
  pgdata:
